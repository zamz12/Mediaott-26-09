# Single-machine stack for LOKAL: the app, worker, and all infra together —
# built for exactly this use case: run entirely on your own laptop, no
# internet dependency once images are pulled, no cloud account needed.
# `name: lokal` plus explicit container_name/volume/network prefixes below
# guarantee this never collides with an unrelated project (e.g. a different
# app you're also running) on the same machine — every resource this stack
# creates is namespaced "lokal-"/"lokal_", on its own private network,
# regardless of which folder it's checked out into.
name: lokal

networks:
  lokal-network:
    name: lokal-network

volumes:
  lokal_postgres_data:
  lokal_redis_data:
  lokal_minio_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: lokal-postgres
    restart: unless-stopped
    networks: [lokal-network]
    environment:
      POSTGRES_USER: lokal
      POSTGRES_PASSWORD: lokal_dev_password
      POSTGRES_DB: lokal
    ports:
      - "5432:5432"
    volumes:
      - lokal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lokal"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lokal-redis
    restart: unless-stopped
    networks: [lokal-network]
    ports:
      - "6379:6379"
    volumes:
      - lokal_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO's Docker Hub images (minio/minio, minio/mc) are gone — Docker Hub
    # now returns "repository does not exist" for both. Quay.io is their
    # current registry (confirmed working).
    image: quay.io/minio/minio:latest
    container_name: lokal-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    networks: [lokal-network]
    environment:
      MINIO_ROOT_USER: lokal_minio
      MINIO_ROOT_PASSWORD: lokal_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - lokal_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the private buckets StorageProvider expects
  # (Section 15) and exits. MinIO doesn't auto-create buckets, and without
  # this the first upload/vault action would fail with "bucket not found."
  # Uses the app's own image (Node + @aws-sdk/client-s3) rather than pulling
  # a separate `minio/mc` image, which has become unreliable on Docker Hub
  # since MinIO's licensing changes ("repository does not exist").
  minio-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: lokal-minio-init
    networks: [lokal-network]
    environment:
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: ap-southeast-5
      STORAGE_ACCESS_KEY_ID: lokal_minio
      STORAGE_SECRET_ACCESS_KEY: lokal_minio_secret
      STORAGE_BUCKET_MASTERS: lokal-masters
      STORAGE_BUCKET_TRANSCODED: lokal-transcoded
      STORAGE_BUCKET_PREVIEWS: lokal-previews
      STORAGE_BUCKET_THUMBNAILS: lokal-thumbnails
      STORAGE_BUCKET_SUBTITLES: lokal-subtitles
      STORAGE_BUCKET_VAULT: lokal-private-vault
      STORAGE_BUCKET_TEMP: lokal-temporary
    command: ["node", "scripts/create-buckets.mjs"]
    depends_on:
      minio: { condition: service_healthy }
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: lokal-app
    restart: unless-stopped
    networks: [lokal-network]
    env_file: .env
    environment:
      # Inside the compose network, infra is reached by service name, not
      # localhost — everything else (AUTH_SECRET, feature flags, etc.)
      # still comes from .env via env_file above.
      DATABASE_URL: postgresql://lokal:lokal_dev_password@postgres:5432/lokal?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
    ports:
      - "3000:3000"
    # Applies any pending migrations on every start (safe/idempotent) before
    # serving — so a fresh checkout needs no extra manual migrate step.
    command: >
      sh -c "npx prisma migrate deploy && pnpm start"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: lokal-worker
    restart: unless-stopped
    networks: [lokal-network]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://lokal:lokal_dev_password@postgres:5432/lokal?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
