version: "3.9"

# Local development infrastructure for LOKAL.
# Production replaces `minio` with AWS S3 (ap-southeast-5) and `postgres`/`redis`
# with managed RDS/ElastiCache — the app never talks to these containers by name,
# only through env-configured connection strings, so swapping is a config change.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lokal
      POSTGRES_PASSWORD: lokal_dev_password
      POSTGRES_DB: lokal
    ports:
      - "5432:5432"
    volumes:
      - lokal_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - lokal_redis_data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lokal_minio
      MINIO_ROOT_PASSWORD: lokal_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - lokal_minio_data:/data

volumes:
  lokal_postgres_data:
  lokal_redis_data:
  lokal_minio_data:
