<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline — LOKAL</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b0e14; color: #f3f5f7; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; }
  .card { max-width: 360px; }
  h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
  p { color: #9aa3b2; font-size: 0.9rem; line-height: 1.5; }
  button { margin-top: 1.5rem; background: #22d3ee; color: #0b0e14; border: none; border-radius: 999px; padding: 0.75rem 1.5rem; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>LOKAL needs a connection to stream video. Check your network and try again — anything already downloaded to your device isn't affected.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
